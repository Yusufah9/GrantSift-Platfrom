name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Placeholder values so the build can complete without real
          # secrets. Nothing here is called at build time — every real
          # service call happens inside a server action or route handler
          # at request time, guarded by requireEnv(). A production deploy
          # on Vercel uses the project's real environment variables instead.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          DEMO_MODE: "false"

  # End-to-end tests need a live Supabase project, a live Gemini key, a live
  # YouTube key, and a real running instance of the app — none of which
  # belong in this repository's CI secrets by default. Configure the
  # E2E_BASE_URL, E2E_TEST_EMAIL, E2E_TEST_PASSWORD, and Playwright browser
  # install as repository secrets and uncomment this job once a staging
  # environment exists. See e2e/README.md.
  #
  # e2e:
  #   runs-on: ubuntu-latest
  #   needs: build-and-test
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with: { node-version: "20", cache: "npm" }
  #     - run: npm ci
  #     - run: npx playwright install --with-deps chromium
  #     - run: npm run test:e2e
  #       env:
  #         E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
  #         E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
  #         E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
